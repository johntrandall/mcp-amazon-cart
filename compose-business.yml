# mcp-amazon-cart-business — Portainer stack
#
# Sibling of compose-personal.yml. Same image, distinct container name,
# distinct volume, distinct ports, distinct AMAZON_DOMAIN.
#
# Ports (corrected 2026-06-12 — original briefing said 8936/5936 but
# 8936 = chase-mcp-onprem is already in use per
# inventories/MCP-Server-Inventory.md). Business stack takes
# 8938 (HTTP) + 5938 (VNC).
#
# See compose-personal.yml for full annotation; this file keeps comments
# minimal to highlight only the per-stack deltas.

services:
  mcp-amazon-cart-business:
    # PINNED BY DIGEST (2026-09-24). Do NOT restore `build:` here.
    # Each stack used to build its own image and write the same
    # `mcp-amazon-cart:local` tag, so the tag pointed at whichever stack built
    # last and each container was pinned to its own image id. That is how the
    # personal tenant ended up on a dangling untagged image while business ran
    # the tag. Now all three reference ONE artifact built once and pushed to
    # Zot, so divergence is structurally impossible rather than merely
    # detectable. Ship a new version by building, pushing and bumping this
    # digest deliberately -- never by redeploying and hoping.
    # Verify with `docker inspect --format '{{.Config.Image}}'`; `docker ps`
    # STRIPS the @sha256 and will make a pinned container look unpinned.
    image: localhost:5050/vendor/mcp-amazon-cart@sha256:6c3770da2c6c5e4be6f5b1210897d85b00ce038f5ae5a5780df7917978ab9ea2
    container_name: mcp-amazon-cart-business
    restart: unless-stopped

    mem_limit: 3g
    cpu_shares: 1024
    shm_size: 2gb

    ports:
      - "8938:3000"
      - "5938:5900"

    environment:
      # business.amazon.com — Track 3's amazon-business.ts module reads
      # AMAZON_DOMAIN to switch the BASE_URL between consumer and B2B.
      AMAZON_DOMAIN: business.amazon.com
      USER_DATA_DIR: /data/user-data
      HEADLESS: ${HEADLESS:-true}
      MCP_HTTP_PORT: "3000"
      DISPLAY: ":99"
      DISPLAY_NUM: "99"
      VNC_PORT: "5900"
      AUTH_TOKEN: ${AUTH_TOKEN}
      VNC_PASSWORD: ${VNC_PASSWORD}
      TZ: "America/New_York"
      RETURNS_HOST_PATH_PREFIX: /volume1/docker/amazon-returns
      # ---- v1.1 session-health (runtime `op read` from 1Password) ----
      # Same shape as compose-personal.yml; per-stack env values differ
      # (paths point at the Amazon Business 1P entry, not Personal).
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN}
      # Business account:
      #   op://JRVIS Execution/Amazon Business/username
      #   op://JRVIS Execution/Amazon Business/password
      #   op://JRVIS Execution/Amazon Business/one-time password   (optional, only if MFA enabled)
      AMAZON_LOGIN_EMAIL_1P_PATH: ${AMAZON_LOGIN_EMAIL_1P_PATH}
      AMAZON_LOGIN_PASSWORD_1P_PATH: ${AMAZON_LOGIN_PASSWORD_1P_PATH}
      AMAZON_LOGIN_TOTP_1P_PATH: ${AMAZON_LOGIN_TOTP_1P_PATH:-}
      PUSHOVER_APP_TOKEN_1P_PATH: ${PUSHOVER_APP_TOKEN_1P_PATH}
      PUSHOVER_USER_KEY_1P_PATH: ${PUSHOVER_USER_KEY_1P_PATH}
      PUSHOVER_TEST_MODE: ${PUSHOVER_TEST_MODE:-false}

    volumes:
      - mcp-amazon-cart-business_user-data:/data/user-data
      - /volume1/docker/amazon-returns:/var/lib/amazon-cart/returns
      - /volume1/docker/amazon-cart-session-health:/var/lib/amazon-cart/session-health

    dns:
      - 100.100.100.100
      - 1.1.1.1

volumes:
  mcp-amazon-cart-business_user-data:
    name: mcp-amazon-cart-business_user-data
